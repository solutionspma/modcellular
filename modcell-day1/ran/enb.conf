#####################################################################
# Mod Cellular — srsRAN 4 eNB config for Open5GS MME
# Set mme_addr to your Open5GS MME IP (127.0.0.1 if same host)
#####################################################################

[enb]
enb_id = 0x19B
mcc = 001
mnc = 01
mme_addr = 127.0.0.1
gtp_bind_addr = 127.0.0.1
gtp_advertise_addr = 127.0.0.1
s1c_bind_addr = 127.0.0.1
s1c_bind_port = 0
n_prb = 50

[enb_files]
# Copy sib.conf, rr.conf, rb.conf from srsRAN 4 install (e.g. /usr/share/srsran/enb/)
# or run srsenb from srsRAN 4 build dir where these exist
sib_config = sib.conf
rr_config = rr.conf
rb_config = rb.conf

[rf]
tx_gain = 80
rx_gain = 40
# ZMQ for RF-isolated lab (no SDR):
# device_name = zmq
# device_args = fail_on_disconnect=true,tx_port=tcp://*:2000,rx_port=tcp://localhost:2001,id=enb,base_srate=23.04e6

[log]
all_level = info
filename = /tmp/enb.log
