<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mod Cellular Icon Generator</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: #fff;
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }
        #canvas {
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 246, 255, 0.3);
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        button {
            background: linear-gradient(135deg, #00F6FF, #FF00F5);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        .info {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>MOD CELLULAR ICON GENERATOR</h1>
    <canvas id="canvas" width="1024" height="1024"></canvas>
    <div class="controls">
        <button onclick="downloadIcon()">Download 1024x1024 PNG</button>
        <button onclick="regenerate()">Regenerate</button>
    </div>
    <div class="info">
        Quantum Mesh Diamond • Dual Neon • Carrier-Grade
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const size = 1024;
        const center = size / 2;

        function drawIcon() {
            // Clear canvas
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, size, size);

            // Draw glow bloom
            const bloomGradient = ctx.createRadialGradient(center, center, 0, center, center, 300);
            bloomGradient.addColorStop(0, 'rgba(0, 246, 255, 0.15)');
            bloomGradient.addColorStop(0.5, 'rgba(255, 0, 245, 0.1)');
            bloomGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = bloomGradient;
            ctx.fillRect(0, 0, size, size);

            // Draw cellular arcs (background)
            ctx.save();
            ctx.translate(center, center);
            
            // Cyan arc
            ctx.beginPath();
            ctx.arc(0, 0, 350, -Math.PI * 0.3, Math.PI * 0.3);
            ctx.strokeStyle = '#00F6FF';
            ctx.lineWidth = 8;
            ctx.globalAlpha = 0.6;
            ctx.stroke();
            
            // Magenta arc
            ctx.beginPath();
            ctx.arc(0, 0, 350, Math.PI * 0.7, Math.PI * 1.3);
            ctx.strokeStyle = '#FF00F5';
            ctx.lineWidth = 8;
            ctx.globalAlpha = 0.6;
            ctx.stroke();
            
            ctx.globalAlpha = 1.0;
            ctx.restore();

            // Draw crypto token ring
            ctx.save();
            ctx.translate(center, center);
            ctx.beginPath();
            ctx.arc(0, 0, 240, 0, Math.PI * 2);
            ctx.strokeStyle = '#00F6FF';
            ctx.lineWidth = 3;
            ctx.globalAlpha = 0.7;
            ctx.stroke();
            
            // Add etched markings on ring
            for (let i = 0; i < 32; i++) {
                const angle = (Math.PI * 2 / 32) * i;
                const x1 = Math.cos(angle) * 235;
                const y1 = Math.sin(angle) * 235;
                const x2 = Math.cos(angle) * 245;
                const y2 = Math.sin(angle) * 245;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
            ctx.globalAlpha = 1.0;
            ctx.restore();

            // Draw main diamond
            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(Math.PI / 4);
            
            // Diamond outline with gradient
            const diamondGradient = ctx.createLinearGradient(-150, -150, 150, 150);
            diamondGradient.addColorStop(0, '#00F6FF');
            diamondGradient.addColorStop(0.5, '#7F7BFF');
            diamondGradient.addColorStop(1, '#FF00F5');
            
            ctx.beginPath();
            ctx.moveTo(-150, 0);
            ctx.lineTo(0, -150);
            ctx.lineTo(150, 0);
            ctx.lineTo(0, 150);
            ctx.closePath();
            ctx.strokeStyle = diamondGradient;
            ctx.lineWidth = 6;
            ctx.stroke();
            
            // Neon edge highlight
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00F6FF';
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            // Internal mesh lines
            ctx.strokeStyle = '#00F6FF';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.7;
            
            // Horizontal mesh lines
            ctx.beginPath();
            ctx.moveTo(-100, -50);
            ctx.lineTo(100, -50);
            ctx.moveTo(-100, 0);
            ctx.lineTo(100, 0);
            ctx.moveTo(-100, 50);
            ctx.lineTo(100, 50);
            ctx.stroke();
            
            // Vertical mesh lines
            ctx.strokeStyle = '#FF00F5';
            ctx.beginPath();
            ctx.moveTo(-50, -100);
            ctx.lineTo(-50, 100);
            ctx.moveTo(0, -100);
            ctx.lineTo(0, 100);
            ctx.moveTo(50, -100);
            ctx.lineTo(50, 100);
            ctx.stroke();
            
            // Diagonal mesh lines
            ctx.strokeStyle = '#7F7BFF';
            ctx.beginPath();
            ctx.moveTo(-120, -120);
            ctx.lineTo(120, 120);
            ctx.moveTo(-120, 120);
            ctx.lineTo(120, -120);
            ctx.stroke();
            
            // Central node
            ctx.globalAlpha = 1.0;
            ctx.beginPath();
            ctx.arc(0, 0, 12, 0, Math.PI * 2);
            const nodeGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 12);
            nodeGradient.addColorStop(0, '#FFFFFF');
            nodeGradient.addColorStop(0.7, '#00F6FF');
            nodeGradient.addColorStop(1, '#FF00F5');
            ctx.fillStyle = nodeGradient;
            ctx.fill();
            
            ctx.restore();
        }

        function downloadIcon() {
            const link = document.createElement('a');
            link.download = 'mod-cellular-icon-1024.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function regenerate() {
            drawIcon();
        }

        // Initial draw
        drawIcon();
    </script>
</body>
</html>
